name: UCTP application profile example

on:
  pull_request:
    paths:
      - 'crates/uctp/rvoip-websocket/examples/**'
      - '.github/workflows/uctp-profile-example.yml'
  push:
    branches: [main]
    paths:
      - 'crates/uctp/rvoip-websocket/examples/**'
      - '.github/workflows/uctp-profile-example.yml'

permissions:
  contents: read

jobs:
  loopback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.91.0'
      - run: cargo test --locked -p rvoip-websocket --example application_profile
      - run: python3 crates/uctp/rvoip-websocket/examples/run_application_profile.py
