name: Main Gate

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: main-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Plan all 44 crates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
      specialty: ${{ steps.plan.outputs.specialty }}
      specialty_count: ${{ steps.plan.outputs.specialty_count }}
      sip_jobs: ${{ steps.plan.outputs.sip_jobs }}
      sip_job_count: ${{ steps.plan.outputs.sip_job_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.91.0

      - name: Build full-workspace plan
        id: plan
        run: |
          args=(
            --base HEAD
            --head HEAD
            --changed-file Cargo.lock
            --job-mode combined
            --deferred-sip-mode separate
            --github-output "$GITHUB_OUTPUT"
            --specialty-gate release-tooling
            --specialty-gate rtp-interop
            --specialty-gate vcon-postgres
            --specialty-gate webrtc-runtime
            --specialty-gate examples-smoke
          )
          while IFS= read -r manifest; do
            example="${manifest#examples/}"
            example="${example%/Cargo.toml}"
            args+=(--specialty-gate "example--$example")
          done < <(find examples -mindepth 2 -maxdepth 2 -name Cargo.toml -print | sort)
          python3 scripts/ci/pr_plan.py "${args[@]}"

      - name: Require exactly 44 workspace crates
        run: |
          count="$(jq '.selected_crates | length' target/ci-plan/plan.json)"
          test "$count" = 44 || {
            echo "expected 44 workspace crates, planned $count" >&2
            exit 1
          }

      - name: Upload main plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-evidence-plan
          path: target/ci-plan/plan.json
          retention-days: 30
          if-no-files-found: error

  policy:
    name: Universal policy
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.91.0
          components: rustfmt
      - name: Formatting and CI policy tests
        run: >-
          python3 scripts/ci/run_checks.py policy
          --name policy
          --output target/ci-receipts/policy.json
      - name: Dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans sources
      - name: Upload policy receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-evidence-policy
          path: target/ci-receipts/policy.json
          retention-days: 30
          if-no-files-found: warn

  crate-tests:
    name: Full crate shard ${{ matrix.id }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Keep hosted capacity available for PR feedback and release controllers.
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.91.0
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: main-shard-${{ matrix.id }}
      - name: Install system dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libopus-dev protobuf-compiler pkg-config cmake lsof
      - name: Test and lint shard
        run: >-
          python3 scripts/ci/run_checks.py shard
          --name shard-${{ matrix.id }}
          --packages '${{ matrix.packages_csv }}'
          --output target/ci-receipts/shard-${{ matrix.id }}.json
      - name: Upload shard receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-evidence-shard-${{ matrix.id }}
          path: target/ci-receipts/shard-${{ matrix.id }}.json
          retention-days: 30
          if-no-files-found: warn

  doctest:
    name: Workspace doctests
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.91.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: main-doctest
      - name: Install system dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libopus-dev protobuf-compiler pkg-config cmake lsof
      - name: Run doctests separately
        run: >-
          python3 scripts/ci/run_checks.py doctest
          --name doctest
          --output target/ci-receipts/doctest.json
      - name: Upload doctest receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-evidence-doctest
          path: target/ci-receipts/doctest.json
          retention-days: 30
          if-no-files-found: warn

  sip-tests:
    name: Full SIP ${{ matrix.id }}
    needs: plan
    if: needs.plan.outputs.sip_job_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Full-main coverage is background work; do not starve pull requests.
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.sip_jobs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.91.0
          components: clippy

      - name: Restore SIP lane cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: main-sip-${{ matrix.id }}

      - name: Install system dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libopus-dev protobuf-compiler pkg-config cmake lsof

      - name: Test SIP library, binaries, and examples
        if: matrix.kind == 'core-test'
        run: >-
          python3 scripts/ci/run_checks.py sip-core
          --name sip-${{ matrix.id }}
          --output target/ci-receipts/sip-${{ matrix.id }}.json

      - name: Lint every SIP target
        if: matrix.kind == 'clippy'
        run: >-
          python3 scripts/ci/run_checks.py sip-clippy
          --name sip-${{ matrix.id }}
          --output target/ci-receipts/sip-${{ matrix.id }}.json

      - name: Build and run SIP process fixtures once
        if: matrix.kind == 'fixtures'
        run: >-
          python3 scripts/ci/run_checks.py sip-fixtures
          --name sip-${{ matrix.id }}
          --targets '${{ matrix.targets_csv }}'
          --examples '${{ matrix.examples_csv }}'
          --output target/ci-receipts/sip-${{ matrix.id }}.json

      - name: Run bounded SIP integration partition
        if: matrix.kind == 'integration'
        run: >-
          python3 scripts/ci/run_checks.py sip-integration
          --name sip-${{ matrix.id }}
          --targets '${{ matrix.targets_csv }}'
          --output target/ci-receipts/sip-${{ matrix.id }}.json

      - name: Upload SIP lane receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-evidence-sip-${{ matrix.id }}
          path: target/ci-receipts/sip-${{ matrix.id }}.json
          retention-days: 30
          if-no-files-found: warn

  specialty:
    name: Full specialty ${{ matrix.gate }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.specialty) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.91.0
      - name: Install nightly for release fuzz validation
        if: matrix.gate == 'release-tooling'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: nightly
      - name: Install cargo-fuzz for release fuzz validation
        if: matrix.gate == 'release-tooling'
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2
        with:
          tool: cargo-fuzz@0.13.2
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: main-specialty-${{ matrix.gate }}
      - name: Install common native dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libopus-dev libssl-dev protobuf-compiler pkg-config cmake lsof
      - name: Run full specialty gate
        run: >-
          python3 scripts/ci/run_checks.py specialty
          --name 'specialty-${{ matrix.gate }}'
          --gate '${{ matrix.gate }}'
          --output 'target/ci-receipts/specialty-${{ matrix.gate }}.json'
      - name: Upload specialty receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-evidence-specialty-${{ matrix.gate }}
          path: target/ci-receipts/specialty-${{ matrix.gate }}.json
          retention-days: 30
          if-no-files-found: warn

  main-gate:
    name: Main Gate
    if: always()
    needs: [plan, policy, crate-tests, doctest, specialty, sip-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download all command evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: main-evidence-*
          path: target/main-evidence
          merge-multiple: true
      - name: Reconcile full-workspace evidence
        run: |
          python3 scripts/ci/aggregate_receipts.py \
            --plan target/main-evidence/plan.json \
            --evidence target/main-evidence \
            --output target/main-receipt/main-receipt.json \
            --job 'plan=${{ needs.plan.result }}' \
            --job 'policy=${{ needs.policy.result }}' \
            --job 'crate-tests=${{ needs.crate-tests.result }}' \
            --job 'sip-tests=${{ needs.sip-tests.result }}' \
            --job 'specialty=${{ needs.specialty.result }}' \
            --job 'doctest=${{ needs.doctest.result }}' \
            --required-job doctest \
            --shard-layout shards \
            --required-receipt doctest
      - name: Upload full main receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-test-receipt
          path: target/main-receipt/main-receipt.json
          retention-days: 30
          if-no-files-found: warn
