name: Release qualification

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Main commit to qualify, or same-repository branch head to diagnose
        required: true
        default: main
        type: string
      profile:
        description: Preflight, exact-gate diagnosis, core dry run, or qualification
        required: true
        default: remote-core
        type: choice
        options:
          - remote-preflight
          - remote-diagnostic
          - remote-core
          - remote-release
      diagnostic_gates:
        description: Comma-separated exact release or preflight EC2 gate IDs for remote-diagnostic
        required: false
        type: string
      first_candidate:
        description: Force every selected gate to run fresh
        required: true
        default: true
        type: boolean
      prior_run_id:
        description: Optional comma-separated run IDs whose exact matching evidence may be reused
        required: false
        type: string
      changed_since:
        description: Optional prior candidate SHA for fail-closed changed-path validation
        required: false
        type: string

permissions:
  contents: read
  actions: read
  security-events: read

concurrency:
  # Supersede the same qualification request, but allow disjoint diagnostic
  # gate sets for one candidate to use independent EC2 workers concurrently.
  group: release-qualification-${{ inputs.profile }}-${{ inputs.candidate }}-${{ inputs.diagnostic_gates || 'all' }}
  cancel-in-progress: ${{ inputs.profile == 'remote-preflight' || inputs.profile == 'remote-diagnostic' }}

env:
  RELEASE_ENVIRONMENT_ID: rvoip-release-v6-rust-1.91-nextest-0.9.140-prebuilt-perf-v2-lld-ec2-m5-soaklong16
  RUSTUP_MAX_RETRIES: "10"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  plan:
    name: Plan exact-candidate gates
    runs-on: ubuntu-latest
    # Exact-main Rust CodeQL has exceeded 20 minutes and approached 30 on a
    # hosted runner. Keep the job deadline above the one-hour policy poll
    # window so a post-merge dispatch cannot fail while the authoritative
    # analysis is still making progress.
    timeout-minutes: 75
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      hosted_matrix: ${{ steps.plan.outputs.hosted_matrix }}
      aws_matrix: ${{ steps.plan.outputs.aws_matrix }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
      hosted_shard_count: ${{ steps.plan.outputs.hosted_shard_count }}
      aws_shard_count: ${{ steps.plan.outputs.aws_shard_count }}
      candidate_sha: ${{ steps.plan.outputs.candidate_sha }}
      environment_id: ${{ steps.plan.outputs.environment_id }}
      run_count: ${{ steps.plan.outputs.run_count }}
      reuse_count: ${{ steps.plan.outputs.reuse_count }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate }}
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.91.0

      - name: Require protected main candidate or trusted diagnostic branch head
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          git fetch origin main
          if [[ "$PROFILE" == remote-diagnostic ]]; then
            candidate="$(git rev-parse HEAD)"
            git ls-remote --heads origin \
              | awk -v candidate="$candidate" '$1 == candidate { found = 1 } END { exit !found }' \
              || {
                echo "diagnostic candidates must be the exact head of a branch in this repository" >&2
                exit 1
              }
          elif [[ "$PROFILE" == remote-release ]]; then
            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
              echo "remote-release must qualify the current protected main head" >&2
              exit 1
            }
          else
            git merge-base --is-ancestor HEAD origin/main || {
              echo "release candidates must be commits on origin/main" >&2
              exit 1
            }
          fi

      - name: Require complete structured release coverage
        if: inputs.profile == 'remote-release'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          coverage = json.loads(Path('scripts/release/gates.json').read_text())['remote_release_legacy_coverage']
          missing = coverage['unautomated_legacy_ids']
          if missing:
              print('remote-release is fail-closed until every legacy gate has a structured replacement:', *missing, sep='\n- ')
              raise SystemExit(1)
          PY

      - name: Require exact-candidate CodeQL with zero open alerts
        if: inputs.profile == 'remote-release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/ci/check_codeql_release_policy.py
          --repository "${{ github.repository }}"
          --candidate "$(git rev-parse HEAD)"
          --timeout-seconds 3600
          --receipt target/release-plan/codeql-policy.json

      - name: Download prior qualification evidence
        if: inputs.profile != 'remote-preflight' && inputs.profile != 'remote-diagnostic' && inputs.prior_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR_RUN_IDS: ${{ inputs.prior_run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          IFS=, read -r -a run_ids <<< "$PRIOR_RUN_IDS"
          if (( ${#run_ids[@]} > 5 )); then
            echo "at most five prior evidence runs may be combined" >&2
            exit 1
          fi
          for value in "${run_ids[@]}"; do
            run_id="${value//[[:space:]]/}"
            [[ "$run_id" =~ ^[1-9][0-9]*$ ]] || {
              echo "invalid prior run ID: $value" >&2
              exit 1
            }
            gh run download "$run_id" \
              --repo "$REPOSITORY" \
              --name release-gate-evidence \
              --dir "target/prior-evidence/$run_id"
          done

      - name: Plan fresh and reusable gates
        id: plan
        shell: bash
        env:
          FIRST_CANDIDATE: ${{ inputs.first_candidate }}
          PRIOR_RUN_ID: ${{ inputs.prior_run_id }}
          CHANGED_SINCE: ${{ inputs.changed_since }}
          DIAGNOSTIC_GATES: ${{ inputs.diagnostic_gates }}
          PROFILE: ${{ inputs.profile }}
        run: |
          args=(
            --profile "$PROFILE"
            --candidate HEAD
            --environment-id "$RELEASE_ENVIRONMENT_ID"
            --output target/release-plan/plan.json
            --github-output "$GITHUB_OUTPUT"
          )
          if test "$PROFILE" = remote-diagnostic; then
            args+=(--only-gates "$DIAGNOSTIC_GATES")
          fi
          if test "$FIRST_CANDIDATE" = true \
            || test "$PROFILE" = remote-preflight \
            || test "$PROFILE" = remote-diagnostic; then
            args+=(--first-candidate)
          fi
          if test "$PROFILE" != remote-preflight \
            && test "$PROFILE" != remote-diagnostic \
            && test -n "$PRIOR_RUN_ID"; then
            args+=(--prior-evidence target/prior-evidence)
          fi
          if test "$PROFILE" != remote-preflight \
            && test "$PROFILE" != remote-diagnostic \
            && test -n "$CHANGED_SINCE"; then
            args+=(--changed-since "$CHANGED_SINCE")
          fi
          python3 scripts/release/gates.py plan "${args[@]}"

      - name: Summarize plan
        run: |
          {
            echo "## Release qualification plan"
            echo
            echo "- Candidate: \`${{ steps.plan.outputs.candidate_sha }}\`"
            echo "- Profile: \`${{ inputs.profile }}\`"
            echo "- Fresh gates: ${{ steps.plan.outputs.run_count }}"
            echo "- Reused gates: ${{ steps.plan.outputs.reuse_count }}"
            echo "- Runner shards: ${{ steps.plan.outputs.shard_count }}"
            if [[ '${{ inputs.profile }}' == remote-diagnostic ]]; then
              echo "- Reusable for release: no"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload qualification plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-gate-plan
          path: target/release-plan/
          retention-days: 90
          if-no-files-found: error

  gate-hosted:
    name: ${{ matrix.resource_class }} / ${{ matrix.id }}
    if: needs.plan.outputs.hosted_shard_count != '0'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.hosted_matrix) }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.candidate_sha }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.91.0
          components: clippy,rustfmt

      - name: Install nightly for bounded fuzz gates
        if: matrix.needs_nightly
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        if: matrix.needs_nightly
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2
        with:
          tool: cargo-fuzz@0.13.2

      - name: Install cargo-deny
        if: matrix.needs_cargo_deny
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2
        with:
          tool: cargo-deny@0.20.2

      - name: Install hosted-runner native dependencies
        if: matrix.hosted
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libopus-dev libssl-dev libvpx-dev
          protobuf-compiler pkg-config cmake

      - name: Install Chromium for the BridgeFu DTMF regression
        if: matrix.needs_chromium
        run: sudo apt-get install -y chromium

      - name: Run gate shard
        run: >-
          python3 scripts/release/gates.py run-shard
          --candidate '${{ needs.plan.outputs.candidate_sha }}'
          --environment-id '${{ needs.plan.outputs.environment_id }}'
          --gates '${{ matrix.gates_csv }}'
          --output target/release-shard

      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-gate-shard-${{ matrix.id }}
          path: target/release-shard/
          retention-days: 90
          if-no-files-found: warn

  preflight-aws:
    name: Verify ephemeral EC2 capacity
    if: needs.plan.outputs.aws_shard_count != '0'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      ami_id: ${{ steps.capacity.outputs.ami_id }}
    steps:
      - name: Assume the provisioner role without a stored key
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.RVOIP_AWS_PROVISIONER_ROLE_ARN }}
          aws-region: ${{ vars.RVOIP_AWS_REGION }}
          # The controller holds this session through the prebuild (up to
          # 90 min) and the shard wait (up to 170 min). The action default of
          # one hour expired mid-run on the first fleet qualification: four
          # workers were stranded, thirteen finished shards were discarded as
          # untrusted, and the teardown step reported success while unable
          # to describe a single instance. Six hours matches the role's
          # max_session_duration in infra/aws.
          role-duration-seconds: 21600
      - name: Require all compute and storage quota before creating workers
        id: capacity
        env:
          REGION: ${{ vars.RVOIP_AWS_REGION }}
          CACHE_BUCKET: ${{ vars.RVOIP_AWS_CACHE_BUCKET }}
          EVIDENCE_BUCKET: ${{ vars.RVOIP_AWS_EVIDENCE_BUCKET }}
          SUBNET_ID: ${{ vars.RVOIP_AWS_SUBNET_ID }}
          SECURITY_GROUP_ID: ${{ vars.RVOIP_AWS_SECURITY_GROUP_ID }}
          INSTANCE_PROFILE: ${{ vars.RVOIP_AWS_RUNNER_INSTANCE_PROFILE }}
          AMI_PARAMETER: ${{ vars.RVOIP_AWS_AMI_SSM_PARAMETER }}
          AWS_MATRIX: ${{ needs.plan.outputs.aws_matrix }}
        run: |
          set -euo pipefail
          test -n "$REGION"
          test -n "$CACHE_BUCKET"
          test -n "$EVIDENCE_BUCKET"
          test -n "$SUBNET_ID"
          test -n "$SECURITY_GROUP_ID"
          test -n "$INSTANCE_PROFILE"
          test -n "$AMI_PARAMETER"

          # On-Demand Standard (A, C, D, H, I, M, R, T, Z) instance vCPUs.
          aws service-quotas get-service-quota \
            --service-code ec2 --quota-code L-1216C47A \
            --output json > vcpu-quota.json
          aws ec2 describe-instances \
            --filters Name=instance-state-name,Values=pending,running \
            --query 'Reservations[].Instances[].CpuOptions.[CoreCount,ThreadsPerCore]' \
            --output json > vcpu-usage.json
          # Storage for General Purpose SSD (gp3) volumes, in TiB.
          aws service-quotas get-service-quota \
            --service-code ebs --quota-code L-7A658B76 \
            --output json > gp3-quota.json

          # Fail closed on every resource the controller will reference.
          ami_id="$(aws ssm get-parameter --name "$AMI_PARAMETER" \
            --query Parameter.Value --output text)"
          [[ "$ami_id" =~ ^ami-[0-9a-f]+$ ]] || {
            echo "AMI parameter ${AMI_PARAMETER} did not resolve to an AMI ID: ${ami_id}" >&2
            exit 1
          }
          echo "ami_id=${ami_id}" >> "$GITHUB_OUTPUT"
          aws ec2 describe-subnets --subnet-ids "$SUBNET_ID" \
            --query 'Subnets[0].SubnetId' --output text | grep -Fqx "$SUBNET_ID"
          aws ec2 describe-security-groups --group-ids "$SECURITY_GROUP_ID" \
            --query 'SecurityGroups[0].GroupId' --output text | grep -Fqx "$SECURITY_GROUP_ID"
          aws iam get-instance-profile --instance-profile-name "$INSTANCE_PROFILE" \
            --query InstanceProfile.InstanceProfileName --output text | grep -Fqx "$INSTANCE_PROFILE"

          AMI_ID="$ami_id" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          # Machine classes are policy values (docs/AWS_RELEASE_WORKERS.md); an
          # instance type outside this table is a plan bug, not a quota question.
          VCPUS = {
              "m5.large": 2,
              "m5.xlarge": 4,
              "m5.2xlarge": 8,
              "m5.4xlarge": 16,
              "m5.8xlarge": 32,
          }
          workers = json.loads(os.environ["AWS_MATRIX"])["include"]
          unknown = sorted({item["machine_type"] for item in workers} - VCPUS.keys())
          if unknown:
              raise SystemExit(f"unknown EC2 instance types in the plan: {', '.join(unknown)}")
          worker_vcpus = sum(VCPUS[item["machine_type"]] for item in workers)
          worker_instances = len(workers)
          worker_disk_gb = sum(int(item["disk_size_gb"]) for item in workers)
          has_performance = any(
              item["resource_class"].startswith("ec2-performance") for item in workers
          )
          # The 32-vCPU builder runs first and is terminated before measurement
          # workers are created, so capacity is the larger phase, not their sum.
          vcpus = max(worker_vcpus, 32 if has_performance else 0)
          instances = max(worker_instances, 1 if has_performance else 0)
          disk_gb = max(worker_disk_gb, 200 if has_performance else 0)

          vcpu_limit = int(json.loads(Path("vcpu-quota.json").read_text())["Quota"]["Value"])
          vcpu_usage = sum(
              int(cores) * int(threads)
              for cores, threads in json.loads(Path("vcpu-usage.json").read_text())
          )
          gp3_limit_tib = float(json.loads(Path("gp3-quota.json").read_text())["Quota"]["Value"])
          required = {
              "On-Demand Standard vCPUs (L-1216C47A)": (vcpus, vcpu_limit - vcpu_usage),
              "gp3 storage GiB (L-7A658B76)": (disk_gb, int(gp3_limit_tib * 1024)),
          }
          failures = []
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a") as output:
              output.write("## Ephemeral release capacity\n\n")
              output.write(f"- Peak instances: {instances}\n- Peak vCPUs: {vcpus}\n- Peak gp3 storage: {disk_gb} GB\n")
              output.write(f"- Region: {os.environ['REGION']}\n- AMI: `{os.environ['AMI_ID']}`\n\n")
              output.write("| Quota | Required | Available |\n| --- | ---: | ---: |\n")
              for metric, (needed, available) in required.items():
                  output.write(f"| {metric} | {needed} | {available} |\n")
                  if available < needed:
                      failures.append(f"{metric}: requires {needed}, only {available} available")
          if failures:
              raise SystemExit("EC2 capacity preflight failed:\n- " + "\n- ".join(failures))
          PY

  gate-aws:
    name: Run all ephemeral EC2 release shards
    if: needs.plan.outputs.aws_shard_count != '0'
    needs: [plan, preflight-aws]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out controller definition
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.candidate_sha }}

      - name: Assume the provisioner role without a stored key
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.RVOIP_AWS_PROVISIONER_ROLE_ARN }}
          aws-region: ${{ vars.RVOIP_AWS_REGION }}
          # The controller holds this session through the prebuild (up to
          # 90 min) and the shard wait (up to 170 min). The action default of
          # one hour expired mid-run on the first fleet qualification: four
          # workers were stranded, thirteen finished shards were discarded as
          # untrusted, and the teardown step reported success while unable
          # to describe a single instance. Six hours matches the role's
          # max_session_duration in infra/aws.
          role-duration-seconds: 21600

      - name: Bind every worker to the exact candidate and gate shard
        env:
          CANDIDATE: ${{ needs.plan.outputs.candidate_sha }}
          ENVIRONMENT_ID: ${{ needs.plan.outputs.environment_id }}
          AWS_MATRIX: ${{ needs.plan.outputs.aws_matrix }}
        run: |
          set -euo pipefail
          mkdir -p target/aws-controller
          printf '%s\n' "$AWS_MATRIX" > target/aws-controller/matrix.json
          python3 scripts/release/aws_fanout.py prepare \
            --matrix target/aws-controller/matrix.json \
            --candidate "$CANDIDATE" \
            --environment-id "$ENVIRONMENT_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output target/aws-controller/workers.json
          {
            echo "## Ephemeral EC2 fanout"
            echo
            echo "- GitHub controller jobs: 1"
            echo "- EC2 workers: $(jq -r .worker_count target/aws-controller/workers.json)"
            echo "- vCPUs: $(jq -r .required_vcpus target/aws-controller/workers.json)"
            echo "- Idle workers retained after the run: 0"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build selected performance executables once
        id: prebuild
        env:
          REGION: ${{ vars.RVOIP_AWS_REGION }}
          CACHE_BUCKET: ${{ vars.RVOIP_AWS_CACHE_BUCKET }}
          CANDIDATE: ${{ needs.plan.outputs.candidate_sha }}
          ENVIRONMENT_ID: ${{ needs.plan.outputs.environment_id }}
          AMI_ID: ${{ needs.preflight-aws.outputs.ami_id }}
          SUBNET_ID: ${{ vars.RVOIP_AWS_SUBNET_ID }}
          SECURITY_GROUP_ID: ${{ vars.RVOIP_AWS_SECURITY_GROUP_ID }}
          INSTANCE_PROFILE: ${{ vars.RVOIP_AWS_RUNNER_INSTANCE_PROFILE }}
          BUCKET: ${{ vars.RVOIP_AWS_EVIDENCE_BUCKET }}
        run: |
          set -euo pipefail
          mkdir -p target/aws-controller/prebuild target/aws-controller/user-data
          selected_gates="$(
            jq -r '[.workers[] | select(.resource_class | startswith("ec2-performance")) | .gates[]] | unique | join(",")' \
              target/aws-controller/workers.json
          )"
          gates_csv="$(python3 scripts/release/prebuilt_performance.py select-gates \
            --catalog scripts/release/gates.json --gates "$selected_gates")"
          if [[ -z "$gates_csv" ]]; then
            echo "bundle_uri=none" >> "$GITHUB_OUTPUT"
            echo "bundle_sha256=none" >> "$GITHUB_OUTPUT"
            echo "No performance binaries are required for this fanout." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          cache_started="$(date +%s)"
          cache_key="$(python3 scripts/release/prebuilt_performance.py cache-key \
            --candidate "$CANDIDATE" \
            --environment-id "$ENVIRONMENT_ID" \
            --gates "$gates_csv")"
          cache_prefix="release-cache/performance-prebuilt-v1/${cache_key}"
          cache_result_uri="s3://${BUCKET}/${cache_prefix}/prebuild-result.json"
          cache_hit=false
          if aws s3 cp "$cache_result_uri" \
            target/aws-controller/prebuild/cached-result.json >/dev/null 2>&1 \
            && python3 scripts/release/prebuilt_performance.py verify-result \
              --result target/aws-controller/prebuild/cached-result.json \
              --candidate "$CANDIDATE" \
              --environment-id "$ENVIRONMENT_ID" \
              --gates "$gates_csv" \
              --cache-key "$cache_key"; then
            mv target/aws-controller/prebuild/cached-result.json \
              target/aws-controller/prebuild/prebuild-result.json
            cache_hit=true
          else
            rm -f target/aws-controller/prebuild/cached-result.json
          fi

          run_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          builder="rvoip-rel-${run_id}-prebuild"
          prefix="release/${run_id}/prebuild"
          if [[ "$cache_hit" != true ]]; then
            gates_b64="$(printf '%s' "$gates_csv" | base64 -w0)"
            environment_b64="$(printf '%s' "$ENVIRONMENT_ID" | base64 -w0)"
            cleanup_builder() {
              builder_ids="$(aws ec2 describe-instances \
                --filters "Name=tag:Name,Values=${builder}" \
                  Name=tag:managed-by,Values=github-actions \
                  Name=instance-state-name,Values=pending,running,stopping,stopped \
                --query 'Reservations[].Instances[].InstanceId' \
                --output text 2>/dev/null | tr '\t' '\n' | grep -v '^None$' || true)"
              if [[ -n "$builder_ids" ]]; then
                # shellcheck disable=SC2086
                aws ec2 terminate-instances --instance-ids $builder_ids >/dev/null 2>&1 || true
              fi
            }
            trap cleanup_builder EXIT

            python3 scripts/release/aws_fanout.py user-data \
              --startup infra/release-runners/aws-performance-prebuild-startup.sh \
              --env "RVOIP_AWS_REGION=${REGION}" \
              --env "RVOIP_CANDIDATE=${CANDIDATE}" \
              --env "RVOIP_RUN_ID=${run_id}" \
              --env "RVOIP_SHARD_ID=prebuild" \
              --env "RVOIP_RESOURCE_CLASS=ec2-prebuild" \
              --env "RVOIP_EVIDENCE_BUCKET=${BUCKET}" \
              --env "RVOIP_CACHE_BUCKET=${CACHE_BUCKET}" \
              --env "RVOIP_PREFIX=${prefix}" \
              --env "RVOIP_GATES_B64=${gates_b64}" \
              --env "RVOIP_ENVIRONMENT_B64=${environment_b64}" \
              --env "RVOIP_PREBUILT_URI=" \
              --env "RVOIP_PREBUILT_SHA256=" \
              --env "RVOIP_EXTERNAL_MEMORY_DIAGNOSTICS=0" \
              --env "RVOIP_MIMALLOC_ALLOW_THP=" \
              --env "RVOIP_PREBUILD_CACHE_KEY=${cache_key}" \
              --output target/aws-controller/user-data/prebuild.gz

            # The janitor terminates anything still alive after this deadline.
            expires_at="$(date -u -d '+4 hours' +%Y-%m-%dT%H:%M:%SZ)"
            tag_list() {
              # key=value ... -> Tags=[{Key=key,Value=value},...] for --tag-specifications
              local pairs=()
              for pair in "$@"; do
                pairs+=("{Key=${pair%%=*},Value=${pair#*=}}")
              done
              local IFS=,
              printf 'Tags=[%s]' "${pairs[*]}"
            }
            tags="$(tag_list \
              "Name=${builder}" \
              managed-by=github-actions \
              rvoip-role=release-prebuild \
              "rvoip-run-id=${run_id}" \
              "rvoip-candidate=${CANDIDATE}" \
              rvoip-shard-id=prebuild \
              rvoip-resource-class=ec2-prebuild \
              "rvoip-expires-at=${expires_at}")"
            aws ec2 run-instances \
              --image-id "$AMI_ID" \
              --instance-type m5.8xlarge \
              --subnet-id "$SUBNET_ID" \
              --security-group-ids "$SECURITY_GROUP_ID" \
              --iam-instance-profile "Name=${INSTANCE_PROFILE}" \
              --block-device-mappings 'DeviceName=/dev/sda1,Ebs={VolumeSize=200,VolumeType=gp3,DeleteOnTermination=true}' \
              --metadata-options HttpTokens=required,HttpEndpoint=enabled,InstanceMetadataTags=enabled \
              --instance-initiated-shutdown-behavior terminate \
              --user-data fileb://target/aws-controller/user-data/prebuild.gz \
              --tag-specifications \
                "ResourceType=instance,${tags}" \
                "ResourceType=volume,${tags}" \
              --output json > target/aws-controller/prebuild/create.json
            builder_id="$(jq -r '.Instances[0].InstanceId' target/aws-controller/prebuild/create.json)"

            result_uri="s3://${BUCKET}/${prefix}/prebuild-result.json"
            # 90 minutes. The shared compiler cache makes a warm prebuild a
            # few minutes, but a cold one compiles the whole workspace and
            # every performance executable from scratch, which is what a new
            # account, region, or RELEASE_ENVIRONMENT_ID always starts from.
            # A 40-minute budget cut exactly that first build off mid-compile.
            # Waiting longer costs nothing when the bundle lands early: the
            # loop exits on the object, or as soon as the builder stops.
            for attempt in $(seq 1 180); do
              if aws s3 cp "$result_uri" \
                target/aws-controller/prebuild/prebuild-result.json >/dev/null 2>&1; then
                break
              fi
              state="$(aws ec2 describe-instances --instance-ids "$builder_id" \
                --query 'Reservations[].Instances[].State.Name' --output text 2>/dev/null || true)"
              case "$state" in
                stopped|terminated|shutting-down|stopping)
                  # The result upload and the self-initiated shutdown can cross
                  # between polls; check the exact object once more.
                  if ! aws s3 cp "$result_uri" \
                    target/aws-controller/prebuild/prebuild-result.json >/dev/null 2>&1; then
                    echo "performance prebuilder stopped without an immutable result" >&2
                  fi
                  break
                  ;;
              esac
              echo "Waiting for exact-candidate performance bundle (poll ${attempt}/180)"
              sleep 30
            done
            aws s3 cp "s3://${BUCKET}/${prefix}/prebuild.log" \
              target/aws-controller/prebuild/prebuild.log >/dev/null 2>&1 || true
          fi
          if [[ ! -f target/aws-controller/prebuild/prebuild-result.json ]]; then
            # Without this the step fails on a bare `test -f` and the cause
            # has to be reconstructed from the builder's console output.
            echo "no exact-candidate performance bundle was produced." >&2
            echo "The builder neither uploaded a result nor stopped on its own within the wait budget; it was still building when the controller gave up." >&2
            echo "s3://${BUCKET}/${prefix}/prebuild.log holds the builder log when the builder got far enough to upload one." >&2
            exit 1
          fi
          python3 scripts/release/prebuilt_performance.py verify-result \
            --result target/aws-controller/prebuild/prebuild-result.json \
            --candidate "$CANDIDATE" \
            --environment-id "$ENVIRONMENT_ID" \
            --gates "$gates_csv" \
            --cache-key "$cache_key" \
            --github-output "$GITHUB_OUTPUT"
          manifest_uri="$(jq -r .manifest_uri target/aws-controller/prebuild/prebuild-result.json)"
          manifest_sha="$(jq -r .manifest_sha256 target/aws-controller/prebuild/prebuild-result.json)"
          aws s3 cp "$manifest_uri" \
            target/aws-controller/prebuild/performance-manifest.json >/dev/null
          echo "${manifest_sha}  target/aws-controller/prebuild/performance-manifest.json" \
            | sha256sum --check --status
          duration="$(jq -r .duration_seconds target/aws-controller/prebuild/prebuild-result.json)"
          count="$(jq -r '.selected_gate_ids | length' target/aws-controller/prebuild/prebuild-result.json)"
          {
            echo
            echo "### Shared exact-candidate performance build"
            echo
            echo "- Selected gates: ${count}"
            if [[ "$cache_hit" == true ]]; then
              echo "- Bundle source: verified exact-candidate S3 cache"
              echo "- Cache lookup and verification: $(( $(date +%s) - cache_started ))s"
              echo "- Original build and package duration avoided: ${duration}s"
            else
              echo "- Bundle source: ephemeral m5.8xlarge builder"
              echo "- Build and package duration: ${duration}s"
            fi
            echo "- Builder retained after this step: no"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create every ephemeral release worker concurrently
        env:
          REGION: ${{ vars.RVOIP_AWS_REGION }}
          CANDIDATE: ${{ needs.plan.outputs.candidate_sha }}
          CACHE_BUCKET: ${{ vars.RVOIP_AWS_CACHE_BUCKET }}
          AMI_ID: ${{ needs.preflight-aws.outputs.ami_id }}
          SUBNET_ID: ${{ vars.RVOIP_AWS_SUBNET_ID }}
          SECURITY_GROUP_ID: ${{ vars.RVOIP_AWS_SECURITY_GROUP_ID }}
          INSTANCE_PROFILE: ${{ vars.RVOIP_AWS_RUNNER_INSTANCE_PROFILE }}
          BUCKET: ${{ vars.RVOIP_AWS_EVIDENCE_BUCKET }}
          PREBUILT_URI: ${{ steps.prebuild.outputs.bundle_uri }}
          PREBUILT_SHA256: ${{ steps.prebuild.outputs.bundle_sha256 }}
          EXTERNAL_MEMORY_DIAGNOSTICS: ${{ inputs.profile == 'remote-diagnostic' && '1' || '0' }}
        run: |
          set -euo pipefail
          mkdir -p target/aws-controller/create-logs target/aws-controller/user-data
          run_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # The janitor terminates anything still alive after this deadline.
          expires_at="$(date -u -d '+4 hours' +%Y-%m-%dT%H:%M:%SZ)"
          tag_list() {
            # key=value ... -> Tags=[{Key=key,Value=value},...] for --tag-specifications
            local pairs=()
            for pair in "$@"; do
              pairs+=("{Key=${pair%%=*},Value=${pair#*=}}")
            done
            local IFS=,
            printf 'Tags=[%s]' "${pairs[*]}"
          }
          pids=()
          while IFS= read -r descriptor; do
            shard_id="$(jq -r .id <<< "$descriptor")"
            worker="$(jq -r .name <<< "$descriptor")"
            prefix="$(jq -r .prefix <<< "$descriptor")"
            resource_class="$(jq -r .resource_class <<< "$descriptor")"
            machine_type="$(jq -r .machine_type <<< "$descriptor")"
            disk_type="$(jq -r .disk_type <<< "$descriptor")"
            disk_size_gb="$(jq -r .disk_size_gb <<< "$descriptor")"
            gates_b64="$(jq -r .gates_b64 <<< "$descriptor")"
            environment_b64="$(jq -r .environment_b64 <<< "$descriptor")"
            user_data="target/aws-controller/user-data/${shard_id}.gz"
            python3 scripts/release/aws_fanout.py user-data \
              --startup infra/release-runners/aws-release-startup.sh \
              --shutdown infra/release-runners/aws-release-shutdown.sh \
              --env "RVOIP_AWS_REGION=${REGION}" \
              --env "RVOIP_CANDIDATE=${CANDIDATE}" \
              --env "RVOIP_RUN_ID=${run_id}" \
              --env "RVOIP_SHARD_ID=${shard_id}" \
              --env "RVOIP_RESOURCE_CLASS=${resource_class}" \
              --env "RVOIP_EVIDENCE_BUCKET=${BUCKET}" \
              --env "RVOIP_CACHE_BUCKET=${CACHE_BUCKET}" \
              --env "RVOIP_PREFIX=${prefix}" \
              --env "RVOIP_GATES_B64=${gates_b64}" \
              --env "RVOIP_ENVIRONMENT_B64=${environment_b64}" \
              --env "RVOIP_PREBUILT_URI=${PREBUILT_URI}" \
              --env "RVOIP_PREBUILT_SHA256=${PREBUILT_SHA256}" \
              --env "RVOIP_EXTERNAL_MEMORY_DIAGNOSTICS=${EXTERNAL_MEMORY_DIAGNOSTICS}" \
              --env "RVOIP_MIMALLOC_ALLOW_THP=" \
              --output "$user_data"
            tags="$(tag_list \
              "Name=${worker}" \
              managed-by=github-actions \
              rvoip-role=release-gate \
              "rvoip-run-id=${run_id}" \
              "rvoip-candidate=${CANDIDATE}" \
              "rvoip-shard-id=${shard_id}" \
              "rvoip-resource-class=${resource_class}" \
              "rvoip-expires-at=${expires_at}")"
            (
              aws ec2 run-instances \
                --image-id "$AMI_ID" \
                --instance-type "$machine_type" \
                --subnet-id "$SUBNET_ID" \
                --security-group-ids "$SECURITY_GROUP_ID" \
                --iam-instance-profile "Name=${INSTANCE_PROFILE}" \
                --block-device-mappings "DeviceName=/dev/sda1,Ebs={VolumeSize=${disk_size_gb},VolumeType=${disk_type},DeleteOnTermination=true}" \
                --metadata-options HttpTokens=required,HttpEndpoint=enabled,InstanceMetadataTags=enabled \
                --instance-initiated-shutdown-behavior terminate \
                --user-data "fileb://${user_data}" \
                --tag-specifications \
                  "ResourceType=instance,${tags}" \
                  "ResourceType=volume,${tags}" \
                --output json
            ) > "target/aws-controller/create-logs/${shard_id}.log" 2>&1 &
            pids+=("$!")
          done < <(jq -c '.workers[]' target/aws-controller/workers.json)

          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          if (( status != 0 )); then
            tail -n 100 target/aws-controller/create-logs/*.log
            exit "$status"
          fi

      - name: Wait for every immutable worker result
        env:
          BUCKET: ${{ vars.RVOIP_AWS_EVIDENCE_BUCKET }}
        run: |
          set -euo pipefail
          mkdir -p target/aws-controller/downloads
          expected="$(jq -r .worker_count target/aws-controller/workers.json)"
          run_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          builder="rvoip-rel-${run_id}-prebuild"
          for attempt in $(seq 1 340); do
            {
              aws s3api list-objects-v2 \
                --bucket "$BUCKET" \
                --prefix "release/${run_id}/" \
                --query 'Contents[].Key' \
                --output text 2>/dev/null \
                | tr '\t' '\n' \
                | awk -v bucket="$BUCKET" '$0 != "" && $0 != "None" { print "s3://" bucket "/" $0 }'
            } > target/aws-controller/objects.txt || true
            aws ec2 describe-instances \
              --filters "Name=tag:rvoip-run-id,Values=${run_id}" Name=tag:managed-by,Values=github-actions \
              --query 'Reservations[].Instances[].[Tags[?Key==`Name`]|[0].Value,State.Name]' \
              --output text | tr '\t' ',' > target/aws-controller/states-all.csv
            awk -F, -v builder="$builder" 'NF >= 2 && $1 != builder' \
              target/aws-controller/states-all.csv > target/aws-controller/states.csv
            completed=0
            terminated_without_result=()
            while IFS= read -r descriptor; do
              shard_id="$(jq -r .id <<< "$descriptor")"
              worker="$(jq -r .name <<< "$descriptor")"
              prefix="$(jq -r .prefix <<< "$descriptor")"
              directory="target/aws-controller/downloads/${shard_id}"
              result_uri="s3://${BUCKET}/${prefix}/result.json"
              mkdir -p "$directory"
              if [[ ! -f "${directory}/result.json" ]] \
                && grep -Fqx "$result_uri" target/aws-controller/objects.txt; then
                aws s3 cp "$result_uri" "${directory}/result.json" >/dev/null
              fi
              if [[ -f "${directory}/result.json" ]]; then
                completed=$((completed + 1))
                continue
              fi
              state="$(awk -F, -v worker="$worker" '$1 == worker { print $2 }' target/aws-controller/states.csv)"
              case "$state" in
                stopped|terminated|shutting-down|stopping)
                  # The result upload and instance-state update can cross between
                  # the two bulk polls. Check the exact object once more before
                  # treating a stopped worker as an evidence failure.
                  if aws s3 cp "$result_uri" "${directory}/result.json" >/dev/null 2>&1; then
                    completed=$((completed + 1))
                    continue
                  fi
                  terminated_without_result+=("$worker")
                  ;;
              esac
            done < <(jq -c '.workers[]' target/aws-controller/workers.json)

            # A candidate that has already failed the bounded performance,
            # burst, or proxy lane cannot become releasable by finishing an
            # hour-long soak.  Preserve all early results, then stop only the
            # still-running deferred workers so fixes can be verified without
            # waiting for proof that can no longer qualify this candidate.
            cutoff_json="$(python3 scripts/release/aws_fanout.py \
              early-failure-decision \
              --manifest target/aws-controller/workers.json \
              --downloads target/aws-controller/downloads \
              --states target/aws-controller/states.csv)"
            while IFS= read -r failed_shard; do
              announcement="target/aws-controller/downloads/${failed_shard}/failure-announced"
              if [[ ! -f "$announcement" ]]; then
                echo "::error title=EC2 release gate failed::${failed_shard} reported or produced invalid failure evidence"
                touch "$announcement"
              fi
            done < <(jq -r '.failed_shards[]' <<< "$cutoff_json")
            mapfile -t deferred_running \
              < <(jq -r '.deferred_running[]' <<< "$cutoff_json")
            if [[ "$(jq -r .should_stop <<< "$cutoff_json")" == true \
              && ! -f target/aws-controller/early-failure-cutoff.txt ]]; then
              early_expected="$(jq -r .early_expected <<< "$cutoff_json")"
              early_settled="$(jq -r .early_settled <<< "$cutoff_json")"
              observed_failures="$(jq '.failed_shards | length' <<< "$cutoff_json")"
              printf '%s\n' "${deferred_running[@]}" \
                > target/aws-controller/early-failure-cutoff.txt
              echo "::error title=Release candidate rejected early::Stopping ${#deferred_running[@]} deferred EC2 workers after the bounded lane failed"
              {
                echo
                echo "### Early failure cutoff"
                echo
                echo "- Bounded EC2 workers settled: ${early_settled}/${early_expected}"
                echo "- Observed failures: ${observed_failures}"
                echo "- Deferred workers stopped: ${#deferred_running[@]}"
                echo "- Completed evidence remains reusable when its exact digests match."
              } >> "$GITHUB_STEP_SUMMARY"
              # An ACPI stop runs the shutdown checkpoint, which snapshots
              # partial evidence; the terminate step reclaims the instance.
              deferred_names="$(IFS=,; printf '%s' "${deferred_running[*]}")"
              mapfile -t deferred_ids < <(
                aws ec2 describe-instances \
                  --filters "Name=tag:rvoip-run-id,Values=${run_id}" \
                    Name=tag:managed-by,Values=github-actions \
                    "Name=tag:Name,Values=${deferred_names}" \
                    Name=instance-state-name,Values=pending,running \
                  --query 'Reservations[].Instances[].InstanceId' \
                  --output text 2>/dev/null | tr '\t' '\n' | grep -v '^None$' || true
              )
              if (( ${#deferred_ids[@]} != 0 )); then
                aws ec2 stop-instances --instance-ids "${deferred_ids[@]}" >/dev/null || true
              fi
            fi
            settled=$((completed + ${#terminated_without_result[@]}))
            if (( settled == expected )); then
              if (( ${#terminated_without_result[@]} != 0 )); then
                printf '%s\n' "${terminated_without_result[@]}" \
                  > target/aws-controller/terminated-without-result.txt
                echo "EC2 workers terminated without immutable results: ${terminated_without_result[*]}" >&2
              fi
              exit 0
            fi
            echo "EC2 release evidence: ${completed} complete, ${#terminated_without_result[@]} failed without a result, ${expected} total (poll ${attempt}/340)"
            sleep 30
          done
          echo "EC2 release fanout exceeded its 170-minute evidence deadline" >&2
          exit 1

      - name: Download and verify every shard evidence bundle
        if: always()
        env:
          BUCKET: ${{ vars.RVOIP_AWS_EVIDENCE_BUCKET }}
        run: |
          set -euo pipefail
          pids=()
          while IFS= read -r descriptor; do
            shard_id="$(jq -r .id <<< "$descriptor")"
            prefix="$(jq -r .prefix <<< "$descriptor")"
            directory="target/aws-controller/downloads/${shard_id}"
            (
              mkdir -p "$directory"
              if [[ ! -f "${directory}/result.json" ]]; then
                aws s3 cp \
                  "s3://${BUCKET}/${prefix}/result.json" \
                  "${directory}/result.json" || true
              fi
              if [[ -f "${directory}/result.json" ]]; then
                aws s3 cp \
                  "s3://${BUCKET}/${prefix}/release-shard.tar.gz" \
                  "${directory}/release-shard.tar.gz"
                aws s3 cp \
                  "s3://${BUCKET}/${prefix}/qualification.log" \
                  "${directory}/qualification.log" || true
              fi
            ) > "target/aws-controller/download-${shard_id}.log" 2>&1 &
            pids+=("$!")
          done < <(jq -c '.workers[]' target/aws-controller/workers.json)

          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          if (( status != 0 )); then
            tail -n 100 target/aws-controller/download-*.log
          fi
          python3 scripts/release/aws_fanout.py verify \
            --manifest target/aws-controller/workers.json \
            --downloads target/aws-controller/downloads \
            --output target/release-shard

      - name: Terminate all workers and root volumes
        if: always()
        run: |
          set -euo pipefail
          run_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # Root volumes are DeleteOnTermination=true, so terminating the
          # instance reclaims the disk without a second sweep.
          mapfile -t workers < <(
            aws ec2 describe-instances \
              --filters "Name=tag:rvoip-run-id,Values=${run_id}" \
                Name=tag:managed-by,Values=github-actions \
                Name=instance-state-name,Values=pending,running,stopping,stopped \
              --query 'Reservations[].Instances[].InstanceId' \
              --output text | tr '\t' '\n' | grep -v '^None$' || true
          )
          if (( ${#workers[@]} != 0 )); then
            aws ec2 terminate-instances --instance-ids "${workers[@]}" \
              --output json > target/aws-controller/terminate.json
            # Termination is asynchronous. A worker that was already stopping
            # when the request landed, such as one the early-failure cutoff
            # stopped, can still report `stopping` for a few seconds, and a
            # single immediate re-list failed a qualification on exactly that.
            # Wait for the terminal state (15 s polls, 10 min cap) instead.
            aws ec2 wait instance-terminated --instance-ids "${workers[@]}"
          fi
          # An empty list is only a clean teardown if the listing itself
          # succeeded. With expired credentials describe-instances fails,
          # the `|| true` above yields an empty array, and this step used
          # to exit 0 having terminated nothing. Ask once more without the
          # guard so a credential or API failure fails the step; the sweep
          # job still runs afterwards and verifies the fleet is empty.
          aws ec2 describe-instances \
            --filters "Name=tag:rvoip-run-id,Values=${run_id}" \
              Name=tag:managed-by,Values=github-actions \
              Name=instance-state-name,Values=pending,running,stopping,stopped \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text > target/aws-controller/terminate-verify.txt
          if grep -qvE '^(None)?$' target/aws-controller/terminate-verify.txt; then
            echo "workers still present after terminate-instances:" >&2
            cat target/aws-controller/terminate-verify.txt >&2
            exit 1
          fi

      - name: Upload merged EC2 shard evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-gate-shard-aws-controller
          path: target/release-shard/
          retention-days: 90
          if-no-files-found: warn

      - name: Upload EC2 controller diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-aws-controller-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/aws-controller/
          retention-days: 30
          if-no-files-found: warn

  cleanup-aws:
    name: Terminate every ephemeral release worker
    if: always() && needs.plan.outputs.aws_shard_count != '0'
    needs: [plan, gate-aws]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Assume the provisioner role without a stored key
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.RVOIP_AWS_PROVISIONER_ROLE_ARN }}
          aws-region: ${{ vars.RVOIP_AWS_REGION }}
          # The controller holds this session through the prebuild (up to
          # 90 min) and the shard wait (up to 170 min). The action default of
          # one hour expired mid-run on the first fleet qualification: four
          # workers were stranded, thirteen finished shards were discarded as
          # untrusted, and the teardown step reported success while unable
          # to describe a single instance. Six hours matches the role's
          # max_session_duration in infra/aws.
          role-duration-seconds: 21600
      - name: Sweep workers left by interrupted controllers
        env:
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          list_run_instances() {
            aws ec2 describe-instances \
              --filters "Name=tag:rvoip-run-id,Values=${RUN_ID}" \
                Name=tag:managed-by,Values=github-actions \
                Name=instance-state-name,Values=pending,running,stopping,stopped \
              --query 'Reservations[].Instances[].InstanceId' \
              --output text | tr '\t' '\n' | grep -v '^None$' || true
          }
          mapfile -t instances < <(list_run_instances)
          if (( ${#instances[@]} != 0 )); then
            echo "Terminating workers left behind: ${instances[*]}"
            aws ec2 terminate-instances --instance-ids "${instances[@]}" >/dev/null
          fi
          remaining="$(list_run_instances)"
          test -z "$remaining"

  collect:
    name: Release Gate
    if: always()
    needs: [plan, gate-hosted, gate-aws, cleanup-aws]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.candidate_sha }}

      - name: Download qualification plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-gate-plan
          path: target/release-plan

      - name: Download fresh gate evidence
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-gate-shard-*
          path: target/release-evidence
          merge-multiple: true

      - name: Reconcile exact-candidate qualification
        run: >-
          python3 scripts/release/gates.py collect
          --plan target/release-plan/plan.json
          --evidence target/release-evidence
          --output target/release-qualification/aggregate.json

      - name: Render exact-candidate qualification reports
        if: inputs.profile == 'remote-release'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version'])
          PY
          )"
          python3 scripts/release/render_qualification_reports.py generate \
            --catalog scripts/release/gates.json \
            --plan target/release-plan/plan.json \
            --aggregate target/release-qualification/aggregate.json \
            --evidence target/release-evidence \
            --version "$version" \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$RUN_URL" \
            --output-dir target/release-qualification/reports

      - name: Attest release qualification bundle
        if: inputs.profile != 'remote-diagnostic'
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: target/release-qualification/aggregate.json

      - name: Upload reusable release evidence
        if: always() && inputs.profile != 'remote-diagnostic'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-gate-evidence
          path: |
            target/release-plan/
            target/release-evidence/
            target/release-qualification/aggregate.json
            target/release-qualification/reports/
          retention-days: 90
          if-no-files-found: warn

      - name: Upload non-reusable diagnostic evidence
        if: always() && inputs.profile == 'remote-diagnostic'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostic-gate-evidence
          path: |
            target/release-plan/
            target/release-evidence/
