# G8 — nightly browser-interop workflow for rvoip-webrtc.
#
# This is the active workflow. The reference copy at
# `crates/webrtc/rvoip-webrtc/docs/ci/nightly-interop.yml` is documentation only.
#
# What it does:
#   1. Installs Chromium on the runner.
#   2. Builds the crate with `interop-browser` + `signaling-whip,signaling-ws`.
#   3. Runs `tests/browser_interop.rs --include-ignored` (the headless
#      Chromium harness from H6 follow-up #43).
#   4. Optionally posts to a Slack webhook on failure (set
#      `secrets.NIGHTLY_INTEROP_WEBHOOK`).
#
# Why nightly rather than per-PR:
#   - Chromium install + launch is heavy (~3 min cold).
#   - WebRTC interop is most useful as a trend signal, not a per-PR gate.
#
# Manually trigger from the Actions UI any time.

name: nightly-interop

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nightly-interop
  cancel-in-progress: true

jobs:
  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: "."
      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium
      - name: Build interop tests
        run: |
          cargo test -p rvoip-webrtc \
            --features interop-browser,signaling-whip,signaling-ws \
            --test browser_interop \
            --no-run
      - name: Run interop tests
        env:
          RUST_BACKTRACE: 1
        run: |
          cargo test -p rvoip-webrtc \
            --features interop-browser,signaling-whip,signaling-ws \
            --test browser_interop \
            -- --include-ignored --nocapture
      # Optional — post a Slack message on failure if a webhook secret exists.
      - name: Notify Slack on failure
        if: failure() && env.WEBHOOK != ''
        env:
          WEBHOOK: ${{ secrets.NIGHTLY_INTEROP_WEBHOOK }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"rvoip-webrtc nightly interop failed on ${{ github.ref }} (commit ${{ github.sha }})\"}" \
            "$WEBHOOK"

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.88.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/browser-smoke/package-lock.json
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: nightly-browser-smoke
      - name: Install native dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libopus-dev protobuf-compiler pkg-config cmake
      - name: Run browser smoke with receipt
        run: >-
          python3 scripts/ci/run_checks.py specialty
          --name specialty-browser-smoke
          --gate browser-smoke
          --output target/ci-receipts/specialty-browser-smoke.json
      - name: Upload nightly evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-browser-smoke-evidence
          path: |
            target/ci-receipts/specialty-browser-smoke.json
            tests/browser-smoke/playwright-report/
          retention-days: 14
          if-no-files-found: warn
