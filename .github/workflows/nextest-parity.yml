name: nextest parity pilot

on:
  schedule:
    - cron: "23 5 * * 0"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nextest-parity
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  archive:
    name: Compare inventory and build archive
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.91.0
      - name: Install pinned cargo-nextest
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2
        with:
          tool: nextest@0.9.140
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: nextest-parity
      - name: Install system dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libopus-dev protobuf-compiler pkg-config cmake
      - name: List tests using cargo
        run: |
          mkdir -p target/nextest
          cargo test --workspace --locked --lib --tests --bins --examples \
            -- --list --format terse > target/nextest/cargo-test-list.txt
      - name: List tests using nextest
        run: >-
          cargo nextest list --workspace --locked
          --lib --tests --bins --examples
          --message-format json
          > target/nextest/nextest-list.json
      - name: Require inventory parity
        run: >-
          python3 scripts/ci/compare_nextest_inventory.py
          --cargo target/nextest/cargo-test-list.txt
          --nextest target/nextest/nextest-list.json
          --output target/nextest/parity.json
      - name: Build reusable nextest archive
        run: >-
          cargo nextest archive --workspace --locked
          --lib --tests --bins --examples
          --archive-file target/nextest/rvoip.tar.zst
      - name: Upload parity evidence and archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nextest-archive
          path: |
            target/nextest/parity.json
            target/nextest/cargo-test-list.txt
            target/nextest/nextest-list.json
            target/nextest/rvoip.tar.zst
          retention-days: 14
          if-no-files-found: error

  partition:
    name: nextest partition ${{ matrix.partition }}/2
    needs: archive
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.91.0
      - name: Install pinned cargo-nextest
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2
        with:
          tool: nextest@0.9.140
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nextest-archive
          path: target/nextest
      - name: Run archived partition
        run: >-
          cargo nextest run
          --archive-file target/nextest/rvoip.tar.zst
          --profile ci
          --partition count:${{ matrix.partition }}/2
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nextest-junit-${{ matrix.partition }}
          path: target/nextest/junit.xml
          retention-days: 14
          if-no-files-found: warn
