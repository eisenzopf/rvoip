name: UCTP JavaScript client

on:
  pull_request:
    paths:
      - 'sdk/uctp-js/**'
      - '.github/workflows/uctp-javascript-client.yml'
  push:
    branches: [main]
    paths:
      - 'sdk/uctp-js/**'
      - '.github/workflows/uctp-javascript-client.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm --prefix sdk/uctp-js ci
      - run: npm --prefix sdk/uctp-js test
      - run: npm --prefix sdk/uctp-js run test:types
