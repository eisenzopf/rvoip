name: UCTP JavaScript client

on:
  pull_request:
    paths:
      - 'sdk/uctp-js/**'
      - '.github/workflows/uctp-javascript-client.yml'
  push:
    branches: [main]
    paths:
      - 'sdk/uctp-js/**'
      - '.github/workflows/uctp-javascript-client.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm --prefix sdk/uctp-js ci
      - run: npm --prefix sdk/uctp-js test
      - run: npm --prefix sdk/uctp-js run test:types
