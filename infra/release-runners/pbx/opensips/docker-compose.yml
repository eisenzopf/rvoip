# OpenSIPS as a registrar-proxy with rtpengine relaying the media — the
# OpenSIPS sibling of the Kamailio+rtpengine lab.
#
# Host networking on purpose: rtpengine allocates RTP ports dynamically, and
# publishing a range through docker's userland proxy is both slow and a
# second NAT to reason about. On colima the services bind the VM's routable
# address (192.168.64.x with `colima start --network-address`); on a Linux
# runner they bind the host directly.
#
# Image digests: opensips matches the sip-proxy interop suite
# (crates/sip/sip-proxy/tests/interop/scripts/common.sh) — keep them in sync.
# rtpengine is run-only GPL, same posture as the Asterisk/FreeSWITCH
# containers; its config below is ours.
services:
  rtpengine:
    image: ${RTPENGINE_IMAGE:-drachtio/rtpengine@sha256:d5bf3715baa197d89f89a70207d06d5509a4284b7392310a94a466ace07afb96}
    platform: linux/amd64
    container_name: rvoip-rtpengine-opensips
    init: true
    network_mode: host
    entrypoint: ["rtpengine"]
    # CLI flags rather than --config-file: this image's rtpengine exits 255
    # with no output on any --config-file invocation (even /dev/null), while
    # the same options as flags work. table=-1 forces userspace forwarding
    # (no kernel module in the colima VM or on the runners); there are NO
    # transcoding flags, so payloads -- AMR in any framing included -- are
    # forwarded verbatim.
    command:
      - "--interface=${RTPENGINE_INTERFACE:?run up.sh, which resolves the public host}"
      - "--listen-ng=127.0.0.1:2224"
      - "--port-min=23300"
      - "--port-max=23500"
      - "--table=-1"
      - "--foreground"
      - "--log-stderr"
      - "--log-level=6"

  opensips:
    image: ${OPENSIPS_IMAGE:-opensips/opensips:3.6@sha256:eba1396b438a7f8a9d33c17017aae4670cb43361eb7130359240cf85fc3e6979}
    platform: linux/amd64
    container_name: rvoip-opensips
    init: true
    network_mode: host
    entrypoint: ["/usr/sbin/opensips"]
    # -F foreground only; stderr logging comes from stderror_enabled=yes in
    # the cfg (the -E flag is rejected as deprecated by OpenSIPS >= 3.4).
    command: ["-F", "-f", "/etc/opensips/opensips.cfg"]
    environment:
      # The image healthcheck greps `Up Time` but opensips-cli 3.6 prints
      # `Up time`, so it can never pass; unsetting its gate makes the check
      # a no-op. up.sh gates real readiness (FIFO answers, rtpengine enabled).
      OPENSIPS_CLI_ENV: "false"
    volumes:
      - ${OPENSIPS_RENDERED_CFG:?run up.sh, which renders opensips.cfg.in}:/etc/opensips/opensips.cfg:ro
    depends_on:
      - rtpengine
