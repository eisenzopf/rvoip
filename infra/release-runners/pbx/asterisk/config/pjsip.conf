; ============================================================
; RTCP and RFC 4028 session-timer release cells (issue #318).
;
; Dedicated endpoints so the 1001-1003/2001-2003 cells keep their exact
; behaviour. Each block mirrors its base template and changes one thing:
;
;   x1xx  rtcp_mux = yes: RTCP shares the RTP port (RFC 5761), both legs.
;   x2xx  rtcp_mux = no, stated explicitly: the peer declines mux, so RTCP
;         needs a separate port (rvoip `rtcp_non_mux`) or is not sent.
;   2301-2302  timers = yes with a 90 s interval (the RFC 4028 floor), so a
;         call survives a refresh on both legs inside a two-minute cell.
;
; The harness maps xNYY onto user x0YY's local ports and passwords
; (examples/pbx/common.rs, `scenario_username`); the cells run serially.
; ============================================================
[rvoip-tls-rtcp-mux-endpoint](!,rvoip-tls-endpoint)
rtcp_mux = yes

[rvoip-udp-rtcp-mux-endpoint](!,rvoip-udp-endpoint)
rtcp_mux = yes

[rvoip-tls-rtcp-port-endpoint](!,rvoip-tls-endpoint)
rtcp_mux = no

[rvoip-udp-rtcp-port-endpoint](!,rvoip-udp-endpoint)
rtcp_mux = no

[rvoip-udp-timer-endpoint](!,rvoip-udp-endpoint)
timers = yes
timers_sess_expires = 90
timers_min_se = 90

[1101](rvoip-tls-rtcp-mux-endpoint)
auth = auth1101
aors = 1101
callerid = "rvoip 1101" <1101>

[auth1101]
type = auth
auth_type = userpass
username = 1101
password = <redacted>

[1101](rvoip-aor)

