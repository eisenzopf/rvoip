[global]
type = global
user_agent = rvoip-local-asterisk
endpoint_identifier_order = auth_username,username,ip,anonymous

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
external_signaling_address = 192.168.64.2
external_media_address = 192.168.64.2

[transport-tls]
type = transport
protocol = tls
bind = 0.0.0.0:5061
cert_file = /etc/asterisk/keys/asterisk.pem
priv_key_file = /etc/asterisk/keys/asterisk-key.pem
ca_list_file = /etc/asterisk/keys/ca.pem
method = tlsv1_2
verify_client = no
verify_server = no
external_signaling_address = 192.168.64.2
external_media_address = 192.168.64.2

[rvoip-tls-endpoint](!)
type = endpoint
transport = transport-tls
context = from-internal
disallow = all
allow = ulaw
allow = alaw
allow = g729
allow = amr
allow = amrwb
dtmf_mode = rfc4733
direct_media = no
force_rport = yes
rtp_symmetric = yes
rewrite_contact = no
media_encryption = sdes
media_encryption_optimistic = no
timers = no

[rvoip-udp-endpoint](!)
type = endpoint
transport = transport-udp
context = from-internal
disallow = all
allow = ulaw
allow = alaw
allow = g729
allow = amr
allow = amrwb
dtmf_mode = rfc4733
direct_media = no
force_rport = yes
rtp_symmetric = yes
rewrite_contact = no
timers = no

[rvoip-aor](!)
type = aor
max_contacts = 1
remove_existing = yes
qualify_frequency = 0

[1001](rvoip-tls-endpoint)
auth = auth1001
aors = 1001
callerid = "rvoip 1001" <1001>

[auth1001]
type = auth
auth_type = userpass
username = 1001
password = <redacted>

[1001](rvoip-aor)

[1002](rvoip-tls-endpoint)
auth = auth1002
aors = 1002
callerid = "rvoip 1002" <1002>

[auth1002]
type = auth
auth_type = userpass
username = 1002
password = <redacted>

[1002](rvoip-aor)

[1003](rvoip-tls-endpoint)
auth = auth1003
aors = 1003
callerid = "rvoip 1003" <1003>

[auth1003]
type = auth
auth_type = userpass
username = 1003
password = <redacted>

[1003](rvoip-aor)

[2001](rvoip-udp-endpoint)
auth = auth2001
aors = 2001
callerid = "rvoip 2001" <2001>

[auth2001]
type = auth
auth_type = userpass
username = 2001
password = <redacted>

[2001](rvoip-aor)

[2002](rvoip-udp-endpoint)
auth = auth2002
aors = 2002
callerid = "rvoip 2002" <2002>

[auth2002]
type = auth
auth_type = userpass
username = 2002
password = <redacted>

[2002](rvoip-aor)

[2003](rvoip-udp-endpoint)
auth = auth2003
aors = 2003
callerid = "rvoip 2003" <2003>

[auth2003]
type = auth
auth_type = userpass
username = 2003
password = <redacted>

[2003](rvoip-aor)

; ============================================================
; Perf-bench anonymous endpoint added for sipp baseline runs.
; Accepts inbound INVITEs from any source on transport-udp and
; routes to the perf-bench context (which answers + hangs up).
; ============================================================
[anonymous]
type = endpoint
transport = transport-udp
context = perf-bench
disallow = all
allow = ulaw
allow = alaw
allow = g729
allow = amr
allow = amrwb
dtmf_mode = rfc4733
force_rport = yes
rtp_symmetric = yes
