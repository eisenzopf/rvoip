[global]
type = global
user_agent = rvoip-local-asterisk
endpoint_identifier_order = auth_username,username,ip,anonymous

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
external_signaling_address = 192.168.64.2
external_media_address = 192.168.64.2

[transport-tls]
type = transport
protocol = tls
bind = 0.0.0.0:5061
cert_file = /etc/asterisk/keys/asterisk.pem
priv_key_file = /etc/asterisk/keys/asterisk-key.pem
ca_list_file = /etc/asterisk/keys/ca.pem
method = tlsv1_2
verify_client = no
verify_server = no
external_signaling_address = 192.168.64.2
external_media_address = 192.168.64.2

[rvoip-tls-endpoint](!)
type = endpoint
transport = transport-tls
context = from-internal
disallow = all
allow = ulaw
allow = alaw
allow = g729
allow = amr
allow = amrwb
dtmf_mode = rfc4733
direct_media = no
force_rport = yes
rtp_symmetric = yes
rewrite_contact = no
media_encryption = sdes
media_encryption_optimistic = no
timers = no

[rvoip-udp-endpoint](!)
type = endpoint
transport = transport-udp
context = from-internal
disallow = all
allow = ulaw
allow = alaw
allow = g729
allow = amr
allow = amrwb
dtmf_mode = rfc4733
direct_media = no
force_rport = yes
rtp_symmetric = yes
rewrite_contact = no
timers = no

[rvoip-aor](!)
type = aor
max_contacts = 1
remove_existing = yes
qualify_frequency = 0

[1001](rvoip-tls-endpoint)
auth = auth1001
aors = 1001
callerid = "rvoip 1001" <1001>

[auth1001]
type = auth
auth_type = userpass
username = 1001
password = <redacted>

[1001](rvoip-aor)

[1002](rvoip-tls-endpoint)
auth = auth1002
aors = 1002
callerid = "rvoip 1002" <1002>

[auth1002]
type = auth
auth_type = userpass
