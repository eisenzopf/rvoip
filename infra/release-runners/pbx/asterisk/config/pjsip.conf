; ============================================================
; Perf-bench anonymous endpoint added for sipp baseline runs.
; Accepts inbound INVITEs from any source on transport-udp and
; routes to the perf-bench context (which answers + hangs up).
; ============================================================
[anonymous]
type = endpoint
transport = transport-udp
context = perf-bench
disallow = all
allow = ulaw
allow = alaw
allow = g729
allow = amr
allow = amrwb
dtmf_mode = rfc4733
force_rport = yes
rtp_symmetric = yes
