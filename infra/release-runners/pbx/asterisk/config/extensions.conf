[general]
static = yes
writeprotect = yes
clearglobalvars = no

[globals]

[from-internal]
exten => 1001,1,NoOp(rvoip TLS/SRTP call to 1001)
 same => n,Dial(PJSIP/1001,45)
 same => n,Hangup(${HANGUPCAUSE})

exten => 1002,1,NoOp(rvoip TLS/SRTP call to 1002)
 same => n,Dial(PJSIP/1002,45)
 same => n,Hangup(${HANGUPCAUSE})

exten => 1003,1,NoOp(rvoip TLS/SRTP call to 1003)
 same => n,Dial(PJSIP/1003,45)
 same => n,Hangup(${HANGUPCAUSE})

exten => 2001,1,NoOp(rvoip UDP/RTP call to 2001)
 same => n,Dial(PJSIP/2001,45)
 same => n,Hangup(${HANGUPCAUSE})

exten => 2002,1,NoOp(rvoip UDP/RTP call to 2002)
 same => n,Dial(PJSIP/2002,45)
 same => n,Hangup(${HANGUPCAUSE})

exten => 2003,1,NoOp(rvoip UDP/RTP call to 2003)
 same => n,Dial(PJSIP/2003,45)
 same => n,Hangup(${HANGUPCAUSE})

; RTCP (x1xx mux, x2xx separate port) and session-timer (23xx) cells.
exten => _[12][12]0[12],1,NoOp(rvoip RTCP cell call to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},45)
 same => n,Hangup(${HANGUPCAUSE})

exten => _230[12],1,NoOp(rvoip session-timer cell call to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},45)
 same => n,Hangup(${HANGUPCAUSE})

exten => h,1,NoOp(rvoip call cleanup)
 same => n,NoOp(rvoip call cleanup complete)

exten => _X!,1,NoOp(Unknown extension ${EXTEN})
 same => n,Hangup(1)

; ============================================================
; perf-bench context: catch-all that answers, holds briefly, hangs up.
; Mirrors the shape of `sipp -sn uac` so the call cycle is
; INVITE -> 200 OK -> ACK -> BYE -> 200 OK.
; ============================================================
[perf-bench]
exten => _.,1,NoOp(perf-bench inbound)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Hangup()
