; rtpengine for the Kamailio interop lab. Rendered by up.sh: 192.168.64.2.
;
; table = -1 forces userspace forwarding: there is no rtpengine kernel module
; in the colima VM or on the release runners, and for the lab's call volumes
; userspace relaying is more than enough.
;
; No transcoding sections on purpose — payloads (AMR PTs 104-107 included)
; are forwarded verbatim, and `rtpengine-ctl list totals` reporting zero
; transcoded media is part of the evidence the harness collects.
[rtpengine]
interface = 192.168.64.2
listen-ng = 127.0.0.1:2223
port-min = 23000
port-max = 23200
table = -1
foreground = true
log-stderr = true
log-level = 6
