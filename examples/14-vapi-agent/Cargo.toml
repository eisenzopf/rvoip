[package]
name = "rvoip-example-vapi-agent"
version = "0.3.1"
edition = "2021"
publish = false

[workspace]

[dependencies]
clap = { version = "4", features = ["derive"] }
# Copying into your own project? Drop `path` and keep:
# rvoip = { version = "0.3.1", features = ["app", "vapi"] }
rvoip = { version = "0.3.1", path = "../../crates/rvoip", default-features = false, features = ["app", "vapi"] }
rustls = "0.23"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
