[package]
name = "rvoip-example-secure-call-dtls-srtp"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone project: this empty table detaches the example from the parent
# rvoip workspace so `cargo build` here resolves against the example's own
# lockfile while still pulling `rvoip-sip` by path from the live tree.
[workspace]

[dependencies]
# Copying into your own project? Drop `path` and keep:
# rvoip-sip = { version = "0.2", features = ["dtls-srtp"] }
rvoip-sip = { version = "0.2.2", path = "../../crates/sip/rvoip-sip", features = ["dtls-srtp"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"

[[bin]]
name = "server"
path = "src/server.rs"

[[bin]]
name = "client"
path = "src/client.rs"
