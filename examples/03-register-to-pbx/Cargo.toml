[package]
name = "rvoip-example-register-to-pbx"
version = "0.3.9"
edition = "2021"
rust-version = "1.91"
publish = false

[dependencies]
# Copying into your own project? Drop `path` and keep: rvoip-sip = "0.3.9"
rvoip-sip = { version = "0.3.9", path = "../../crates/sip/rvoip-sip" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
