[package]
name = "rvoip"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
authors.workspace = true
rust-version.workspace = true
categories.workspace = true
keywords.workspace = true

description = "Universal real-time gateway library — SIP, WebRTC, UCTP, Vapi voice agents, AI harness, and vCon behind one facade."

[lints]
workspace = true

# ---------------------------------------------------------------------------
# Dependencies
# ---------------------------------------------------------------------------
#
# rvoip-core is the implementation crate; the facade legitimately
# re-exports its `Orchestrator` + `Config`. This is the only direct
# dep on `rvoip-core` permitted by the workspace `deny.toml` (it's
# listed in `[bans.wrappers]`).

[dependencies]
rvoip-core         = { workspace = true }
rvoip-core-traits  = { workspace = true }

# SIP interop adapter — `sip` feature.
rvoip-sip          = { workspace = true, optional = true }
# STIR/SHAKEN caller-ID attestation (SIP-only) — `sip-stir-shaken` feature.
rvoip-stir-shaken  = { workspace = true, optional = true }

# WebRTC interop adapter — `webrtc` feature.
rvoip-webrtc       = { workspace = true, optional = true }
# Bearer validation surface exposed alongside the WebRTC auth hooks.
rvoip-auth-core    = { workspace = true, optional = true }

# UCTP substrate adapters — `uctp` feature.
rvoip-uctp         = { workspace = true, optional = true }
rvoip-quic         = { workspace = true, optional = true }
rvoip-webtransport = { workspace = true, optional = true }
rvoip-websocket    = { workspace = true, optional = true }

# voip-3 conversation-model extensions — reachable only via the `voip-3` feature.
rvoip-vcon         = { workspace = true, optional = true }
rvoip-identity     = { workspace = true, optional = true }
rvoip-harness      = { workspace = true, optional = true }

# Vapi bidirectional WebSocket agent adapter — `vapi` feature.
rvoip-vapi         = { workspace = true, optional = true }

# Client SDK — `client` feature.
rvoip-client       = { workspace = true, optional = true }

tokio              = { workspace = true, optional = true }
axum               = { workspace = true, optional = true }
bytes              = { workspace = true, optional = true }
chrono             = { workspace = true, optional = true }
thiserror          = { workspace = true, optional = true }
tracing            = { workspace = true, optional = true }

# ---------------------------------------------------------------------------
# Feature flags. Maturity: `sip` is beta; every other surface is alpha (0.1.x).
# Grouped by what each is tied to (see INTERFACE_DESIGN.md §2.2).
# ---------------------------------------------------------------------------

[features]
default = ["sip"]

# ── Transports / surfaces ──
sip      = ["dep:rvoip-sip"]
webrtc   = ["dep:rvoip-webrtc", "dep:rvoip-auth-core"]
uctp     = ["dep:rvoip-uctp", "dep:rvoip-quic", "dep:rvoip-webtransport", "dep:rvoip-websocket"]
vapi     = ["dep:rvoip-vapi"]

# ── SIP media add-ons ──
g729 = ["sip", "rvoip-sip/g729", "rvoip-core/g729"]
amr-nb = ["sip", "rvoip-sip/amr-nb", "rvoip-core/amr-nb"]
amr-wb = ["sip", "rvoip-sip/amr-wb", "rvoip-core/amr-wb"]
amr = ["amr-nb", "amr-wb"]
# Opus needs libopus on the build host, which is why it is not in `full`.
opus = ["sip", "rvoip-sip/opus", "rvoip-core/opus"]
all-codecs = ["g729", "amr", "opus"]

# ── SIP add-on (requires SIP): RFC 8224 caller-ID attestation ──
sip-stir-shaken = ["sip", "dep:rvoip-stir-shaken"]

# ── rvoip-3 bundle: SIP/WebRTC/UCTP + the conversation-model extensions
#    (vCon emission, identity backends, AI harness). vcon / identity / harness are
#    reachable ONLY through this meta-feature, never as standalone features. ──
voip-3 = ["sip", "webrtc", "uctp", "dep:rvoip-vcon", "dep:rvoip-identity", "dep:rvoip-harness"]

# ── Standalone cross-transport client SDK ──
client = ["dep:rvoip-client"]

# ── High-level app/gateway API ──
app = [
    "sip",
    "webrtc",
    "uctp",
    "rvoip-webrtc/signaling-ws",
    # The high-level gateway's WebSocket listener must compile the co-located
    # WebRTC answerer. Without this forwarding edge, authenticated browser
    # legs are admitted but `connection.offer` never receives SDP, so callers
    # time out before an application can bridge them.
    "rvoip-websocket/media-webrtc",
    "dep:tokio",
    "dep:axum",
    "dep:bytes",
    "dep:chrono",
    "dep:thiserror",
    "dep:tracing",
]

# ── Everything that builds with no system libraries ──
# The pure-Rust codecs are included; `opus` is not, because libopus must be
# present on the build host and `full` should not turn a missing system
# package into a build failure. Use `all-codecs` (or `opus`) to add it.
full = ["voip-3", "vapi", "sip-stir-shaken", "client", "app", "g729", "amr"]

# ── Deployment-oriented bundles ──
# Existing leaf and meta-features remain valid. These additive bundles provide
# stable, recognizable starting points; exact membership is described by the
# machine-checked metadata below and rendered into docs/FEATURE_BUNDLES.md.
bundle-sip-endpoint = ["sip"]
bundle-carrier-sip = ["sip", "sip-stir-shaken", "g729", "amr"]
bundle-browser-gateway = ["app", "opus"]
bundle-ai-conversation = ["voip-3", "vapi", "app", "opus"]
bundle-full-pure-rust = ["full"]
bundle-full-native = ["full", "opus"]

[[package.metadata.rvoip.feature-bundles]]
feature = "bundle-sip-endpoint"
name = "SIP endpoint"
members = ["sip"]
codecs = "G.711 mu-law and A-law"
system_dependencies = "None"
maturity = "SIP beta"
description = "A provider-neutral SIP endpoint or server with the standard G.711 codecs."

[[package.metadata.rvoip.feature-bundles]]
feature = "bundle-carrier-sip"
name = "Carrier SIP"
members = ["sip", "sip-stir-shaken", "g729", "amr"]
codecs = "G.711, G.729, AMR-NB, and AMR-WB"
system_dependencies = "None"
maturity = "SIP beta plus preview add-ons"
description = "A carrier-facing SIP service with caller-identity attestation and the pure-Rust telephony codec set."

[[package.metadata.rvoip.feature-bundles]]
feature = "bundle-browser-gateway"
name = "Browser gateway"
members = ["app", "opus"]
codecs = "G.711 and Opus"
system_dependencies = "libopus"
maturity = "Developer preview"
description = "The high-level SIP, WebRTC, and UCTP gateway used to connect browser media to telephony."

[[package.metadata.rvoip.feature-bundles]]
feature = "bundle-ai-conversation"
name = "AI conversation gateway"
members = ["voip-3", "vapi", "app", "opus"]
codecs = "G.711 and Opus"
system_dependencies = "libopus"
maturity = "Developer preview"
description = "Cross-transport conversations, identity, AI harness, Vapi, and the high-level gateway."

[[package.metadata.rvoip.feature-bundles]]
feature = "bundle-full-pure-rust"
name = "Full pure-Rust facade"
members = ["full"]
codecs = "G.711, G.729, AMR-NB, and AMR-WB"
system_dependencies = "None"
maturity = "Mixed: SIP beta and preview surfaces"
description = "Every facade surface and pure-Rust codec without a native codec library."

[[package.metadata.rvoip.feature-bundles]]
feature = "bundle-full-native"
name = "Full facade with native codecs"
members = ["full", "opus"]
codecs = "G.711, G.729, AMR-NB, AMR-WB, and Opus"
system_dependencies = "libopus"
maturity = "Mixed: SIP beta and preview surfaces"
description = "Every facade surface and every mainline audio codec, including native Opus."

[dev-dependencies]
tokio              = { workspace = true }
anyhow             = { workspace = true }
serial_test        = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
