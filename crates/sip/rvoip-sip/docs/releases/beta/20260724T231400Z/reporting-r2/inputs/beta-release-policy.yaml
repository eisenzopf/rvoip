  "gate_kinds": {
    "source": {
      "purpose": "Bind qualification to one clean, unchanged source tree.",
      "components": ["source fingerprint capture and comparison"],
      "configuration_scope": ["beta_require_clean_source", "beta_require_canonical_2k_evidence", "beta_state_table_source"],
      "required_evidence": ["source fingerprint or canonical evidence log with SHA-256"],
      "validators": ["status-pass", "evidence-hash", "source-fingerprint"],
      "pass_meaning": "The recorded source check succeeded for the tested commit and tree.",
      "non_claims": ["Does not test runtime behavior."]
    },
    "cargo": {
      "purpose": "Compile or execute the named Rust scope under the recorded release configuration.",
      "components": ["recorded Cargo command and test harness output"],
      "configuration_scope": ["beta_attestation_features", "beta_attestation_target", "beta_deny_warnings", "rvoip_require_api_tools"],
      "required_evidence": ["command, timestamps, exit status, and hashed gate log"],
      "validators": ["status-pass", "evidence-hash", "command-exit-zero"],
      "pass_meaning": "The named compiler, unit, integration, documentation, or compatibility scope completed successfully.",
      "non_claims": ["Does not establish behavior outside the named feature, target, or test scope."]
    },
    "security": {
      "purpose": "Exercise dependency and parser-hardening evidence required by the security gate.",
      "components": ["cargo-audit or bounded fuzz-smoke target"],
      "configuration_scope": ["beta_gate_require_external"],
      "required_evidence": ["hashed audit or fuzz log and tool output"],
      "validators": ["status-pass", "evidence-hash", "command-exit-zero"],
      "pass_meaning": "The named security check completed without a gate failure.",
      "non_claims": ["Does not prove absence of vulnerabilities or exhaustive parser safety."]
    },
    "interop": {
      "purpose": "Exercise SIP interoperability or managed peer lifecycle required by the selected full configuration.",
      "components": ["PBX, SIPp, strict-UA, or proxy-scope command and its captured evidence"],
      "configuration_scope": ["beta_pbx_provider", "beta_pbx_api", "beta_pbx_scenario", "beta_pbx_g729_profiles", "beta_run_local_pbx", "beta_run_sipp", "beta_run_strict_ua"],
      "required_evidence": ["hashed gate log plus applicable peer matrix, summary, and peer identity"],
      "validators": ["status-pass", "evidence-hash", "interop-result"],
      "pass_meaning": "The named peer, matrix, or lifecycle condition passed with the recorded configuration.",
      "non_claims": ["Does not establish compatibility with untested peers, versions, transports, codecs, or scenarios."]
    },
    "performance": {
      "purpose": "Exercise one required performance, resiliency, soak, regression, or evidence-integrity condition.",
      "components": ["recorded performance command, result JSON, and threshold checks where applicable"],
      "configuration_scope": ["beta_profile_matrix", "beta_run_perf_all", "beta_run_burst_matrix", "beta_run_long_soak", "rvoip_perf_skip_audio_frame_delivery", "rvoip_perf_max_rss_growth_mb_per_hr"],
      "required_evidence": ["hashed gate log and applicable performance JSON result"],
      "validators": ["status-pass", "evidence-hash", "performance-result"],
      "pass_meaning": "The named workload and its applicable thresholds passed under the recorded configuration.",
      "non_claims": ["Does not predict untested hardware, workloads, durations, concurrency, or network conditions."]
    },
    "reporting": {
      "purpose": "Validate or capture evidence required to make the release result reproducible and auditable.",
      "components": ["evidence capture, regression audit, metric validation, or source fence"],
      "configuration_scope": ["beta_perf_regression_fail", "beta_perf_latency_tolerance_pct", "beta_perf_regression_baseline_id", "beta_perf_regression_baseline_manifest_sha256"],
      "required_evidence": ["hashed audit, metric, capture, or source-fence output"],
      "validators": ["status-pass", "evidence-hash", "reporting-check"],
      "pass_meaning": "The named evidence-integrity check completed successfully.",
      "non_claims": ["Does not add runtime coverage beyond the evidence it validates."]
    }
  },
  "selection_rules": {
    "full": {
      "description": "All catalog gates tagged full are required when their condition is true; a scheduled gate is never additional.",
      "required_status": "PASS",
      "allow_skips": false
