[package]
name = "rvoip-codec-core"
# 🎯 INHERIT VERSION AND METADATA FROM WORKSPACE!
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
authors.workspace = true
rust-version.workspace = true
categories.workspace = true
keywords.workspace = true

# Crate-specific description
description = "G.711 and optional G.729/Opus/AMR audio codec implementations for RVOIP"

[lib]
name = "codec_core"
path = "src/lib.rs"

# ✨ INHERIT LINTS FROM WORKSPACE
[lints]
workspace = true

[dependencies]
# External dependencies from workspace
thiserror.workspace = true
tracing.workspace = true

# Crate-specific dependencies not in workspace
tracing-subscriber = "0.3"   # Logging initialization
opus = { version = "0.3", optional = true }

[dev-dependencies]
# Testing
tokio.workspace = true       # Async runtime for tests
criterion = { workspace = true }

[[bench]]
name = "g711_codec"
harness = false
required-features = ["g711"]

[[bench]]
name = "amr_codec"
harness = false
required-features = ["amr-nb", "amr-wb"]

# `codecs::amr` is gated on `any(amr-nb, amr-wb)`, and this example imports it
# unconditionally and walks both variants. Without the declaration Cargo builds
# it under the default feature set, so `--all-targets` fails to compile on any
# build that does not happen to enable AMR.
[[example]]
name = "amr_rtp_vectors"
required-features = ["amr-nb", "amr-wb"]

[features]
default = ["g711"]

# Codec features
g711 = []                    # G.711 μ-law/A-law codec (always available)
g729 = []                    # G.729A/G.729AB codec
opus = ["dep:opus"]          # Opus codec backed by libopus
# Deprecated compatibility alias. This now enables the real backend; it no
# longer selects a simulated codec.
opus-sim = ["opus"]

# AMR-NB / AMR-WB (3GPP TS 26.071 / TS 26.171, RFC 4867).
# Both variants encode and decode bit-exactly against the 3GPP reference
# implementations, including DTX, comfort noise, concealment and homing
# frames, and both pass the normative conformance sequences shipped with
# TS 26.073 and TS 26.173. Those sequences are 3GPP copyright and cannot be
# committed, so the tests covering them are `#[ignore]`d and need a local
# reference tree -- see docs/AMR_IMPLEMENTATION_STATUS.md for how to run them
# and for exactly what is and is not claimed.
amr-nb = []                  # AMR narrowband, 8 kHz
amr-wb = []                  # AMR wideband (G.722.2), 16 kHz -- the HD voice codec
amr = ["amr-nb", "amr-wb"]
all-codecs = ["g711", "g729", "opus", "amr"]
