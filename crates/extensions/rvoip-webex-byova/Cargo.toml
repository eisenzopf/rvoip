[package]
name = "rvoip-webex-byova"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
authors.workspace = true
rust-version.workspace = true
categories.workspace = true
keywords.workspace = true
description = "Webex Contact Center BYOVA (Bring Your Own Virtual Agent) adapter for rvoip"
# Cisco's protobuf contract is not packaged: the optional `grpc` feature reads
# it at build time (see build.rs and scripts/ci/fetch_webex_byova_protos.py).

[features]
default = []
grpc = ["dep:tonic", "dep:tonic-prost", "dep:prost", "dep:prost-types", "dep:tonic-prost-build", "dep:protoc-bin-vendored", "wav-compat"]
# Explicit early-access compatibility exception, contrary to the public WS guide.
wav-compat = ["dep:rvoip-codec-core"]

[dependencies]
rvoip-core.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
dashmap.workspace = true
futures.workspace = true
jsonwebtoken = { version = "12", features = ["aws_lc_rs"] }
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
tracing.workspace = true
zeroize.workspace = true
tonic = { version = "0.14", optional = true }
tonic-prost = { version = "0.14", optional = true }
prost = { version = "0.14", optional = true }
prost-types = { version = "0.14", optional = true }
rvoip-codec-core = { workspace = true, optional = true }

[build-dependencies]
tonic-prost-build = { version = "0.14", optional = true }
protoc-bin-vendored = { version = "3", optional = true }

[dev-dependencies]
rvoip-vapi.workspace = true
tokio = { workspace = true, features = ["test-util"] }
url.workspace = true

[lints]
workspace = true
