[package]
name = "rvoip-vcon"
# Alpha-tier but DOES publish — rvoip-core lists rvoip-vcon as an optional
# runtime dependency behind its `vcon` feature; `vcon-signing` includes `vcon`.
# Cargo therefore verifies this version exists on crates.io even when neither
# feature is activated.
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
authors.workspace = true
rust-version.workspace = true
categories.workspace = true
keywords.workspace = true
description = "vCon (Virtualized Conversation) core model, validator, JWS General JSON signer, and store"

[dependencies]
async-trait.workspace = true
dashmap.workspace = true

serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v4", "v8", "serde"] }
base64.workspace = true
sha2.workspace = true
url.workspace = true
x509-parser.workspace = true
mime = "0.3"

# JWS cryptographic primitives; wire framing is General JSON, not JWT.
jsonwebtoken = { version = "11.0", features = ["rust_crypto"] }

thiserror = "2.0"

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
jsonschema = { version = "0.49.4", default-features = false }

[lints]
workspace = true
