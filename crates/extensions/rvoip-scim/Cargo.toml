[package]
name = "rvoip-scim"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
authors.workspace = true
rust-version.workspace = true
categories.workspace = true
keywords.workspace = true
description = "SCIM 2.0 provisioning adapter for RVoIP users-core"

[dependencies]
async-trait = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
parking_lot.workspace = true
rvoip-auth-core.workspace = true
rvoip-core-traits.workspace = true
rvoip-users-core.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
# `limit` wraps SCIM request bodies; the version matches users-core and
# rvoip-webrtc so no new crate version enters Cargo.lock.
tower-http = { version = "0.7", features = ["limit"] }
uuid = { workspace = true, features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.14"
tower = { version = "0.5", features = ["util"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
