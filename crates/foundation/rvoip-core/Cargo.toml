[package]
name = "rvoip-core"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
authors.workspace = true
rust-version.workspace = true
categories.workspace = true
keywords.workspace = true
description = "Transport-agnostic spine for RVoIP — types, ConnectionAdapter trait, BridgeManager, Orchestrator entry point"

[dependencies]
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
dashmap.workspace = true
rvoip-infra-common.workspace = true
# Codec backends are forwarded by this crate's matching public features. This
# keeps a dependency's advertised feature profile exact instead of allowing an
# unrelated rvoip-core consumer to turn on a native codec for the whole graph.
rvoip-media-core.workspace = true
rvoip-rtp-core.workspace = true
# V2.A — the pure-type/trait surface that consumer crates depend on.
# rvoip-core re-exports from it so existing `use rvoip_core::ids::*`
# and `use rvoip_core::identity::*` call sites keep working unchanged.
rvoip-core-traits.workspace = true
# V2.A.8 — optional rvoip-vcon dep, gated by `vcon`. Now
# possible because the cycle (rvoip-core → rvoip-vcon →
# rvoip-auth-core → rvoip-core) was broken by switching auth-core
# to depend on rvoip-core-traits.
rvoip-vcon = { workspace = true, optional = true }
# V2.A.9 — optional rvoip-harness dep, gated by `harness`. Now
# possible because rvoip-harness depends on rvoip-core-traits, not
# rvoip-core, so this dep doesn't cycle.
rvoip-harness = { workspace = true, optional = true }
tracing.workspace = true
metrics.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true

[dev-dependencies]
# Examples — sip_only_orchestrator demonstrates the cross-transport seam by
# registering rvoip-sip's SipAdapter against a rvoip-core Orchestrator.
# Forward dev-deps (published LATER in the release order) are declared
# path-only — NO version — so `cargo publish` strips them from the published
# manifest instead of demanding they already exist on crates.io. They still
# resolve locally by path for tests/examples. (A versioned dev-dep in a publish
# cycle breaks the run even with --no-verify: packaging still checks the index.)
rvoip-sip = { path = "../../sip/rvoip-sip" }
# cross_transport_bridge proves SIP + WebRTC + QUIC adapters all
# register with one Orchestrator and exercises bridge_connections
# across transport pairs.
rvoip-webrtc = { path = "../../webrtc/rvoip-webrtc" }
rvoip-quic = { path = "../../uctp/rvoip-quic" }
rvoip-uctp = { path = "../../uctp/rvoip-uctp" }
rvoip-auth-core.workspace = true
quinn = { workspace = true }
rustls = { workspace = true }
parking_lot = { workspace = true }
# P5 tests use no-op providers + VecRecordingSink from rvoip-harness to
# exercise the AI / recording dispatch.
rvoip-harness.workspace = true
tracing-subscriber.workspace = true

[[example]]
name = "sip_only_orchestrator"
path = "examples/sip_only_orchestrator.rs"

[[example]]
name = "cross_transport_bridge"
path = "examples/cross_transport_bridge.rs"

[[example]]
name = "checked_rtp_boundary"
path = "examples/checked_rtp_boundary.rs"

[[test]]
name = "vcon_emission"
path = "tests/vcon_emission.rs"
required-features = ["vcon"]

[[test]]
name = "virtual_publisher"
path = "tests/virtual_publisher.rs"
required-features = ["opus"]

[features]
# P11 — feature flags per INTERFACE_DESIGN.md §2.2. The "shape" flags
# (`uctp`/`sip`/`rtp`/`media`) are advisory today — they signal what
# substrate adapters the consumer plans to use but don't gate code in
# `rvoip-core` itself (the trait surface is always compiled). The
# `harness`, `vcon-signing`, and `identity-fingerprint-binding` flags
# DO gate actual code (see the `#[cfg(feature = ...)]` attributes in
# `harness.rs` / `vcon.rs` / `identity.rs`).
default = ["uctp", "sip", "rtp", "media", "vcon", "identity"]
uctp = []
sip = []
rtp = []
media = []
vcon = ["dep:rvoip-vcon"]
identity = []
webrtc = []
aauth-experimental = []
identity-fingerprint-binding = []
# Optional media-graph codec backends. G.711 remains available through
# media-core's default features. Other codecs are selected explicitly.
g729 = ["rvoip-media-core/g729"]
opus = ["rvoip-media-core/opus"]
amr-nb = ["rvoip-media-core/amr-nb"]
amr-wb = ["rvoip-media-core/amr-wb"]
amr = ["amr-nb", "amr-wb"]
all-codecs = ["g729", "opus", "amr"]
# V2.A.8 — Exposes the opt-in vCon JWS signing API. The normal `vcon`
# feature already pulls the canonical document model used by core's
# unsigned auto-emission path.
vcon-signing = ["vcon"]
# V2.A.9 — Recording / transcription / AI dispatch — pulls
# rvoip-harness (now possible after V2.A cycle break).
harness = ["dep:rvoip-harness"]
client = []
full = [
    "webrtc",
    "harness",
    "client",
    "aauth-experimental",
    "identity-fingerprint-binding",
    "vcon-signing",
    "all-codecs",
]

[lints]
workspace = true
